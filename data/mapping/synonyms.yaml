# 属性值同义词表：源值 → 目标值名称
# 用于 map_value 的「显式同义词」这一步，优先级高于模糊匹配、低于精确名称。
# 只在 value 名称对不上但语义相同时使用，不要放模糊匹配能解决的项。

# --- 材质 ---
纯棉: 棉
100%棉: 棉
全棉: 棉
涤纶: 聚酯纤维
聚酯: 聚酯纤维

# --- 颜色 ---
黑: 黑色
白: 白色
红: 红色
灰: 灰色

# --- 端口数 ---
5口: 5个
8口: 8个
16口: 16个
24口: 24个

# --- 尺码 ---
均码: F
OneSize: F

# --- 交换机速率 ---
百兆: 100Mbps
千兆: 1000Mbps
